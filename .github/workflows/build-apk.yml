name: Build APK

on:
  push:
    branches: [main, init/v1]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

# Never run two builds at once, so the "latest" release can't be deleted mid-publish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk carlo-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carlo-debug-apk
          path: carlo-debug.apk

      # Always-up-to-date download link on the repo's Releases page (main only)
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest carlo-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Carlo (latest build)" \
            --notes "Debug APK built from commit $GITHUB_SHA. Enable 'install unknown apps' on your phone to sideload."
